# A5000 full fine-tune recipe (T06)
#
# Compatibility-only: full fine-tuning produced no measurable gain, so the frozen partial
# fine-tune remains the model behind every reported test/test2 number. `env_role` makes the
# trainer write COMPAT.json instead of replacing FROZEN.json.
name: a5000_full_finetune
split: dev
out: results/repro/train/a5000
device: cuda
precision: fp16
base_model: BAAI/bge-reranker-base
freeze_encoder_layers: 0        # full fine-tune
optimizer: adamw
learning_rate: 1.0e-05
negatives_per_positive: 4
batch_size: 32
grad_accum: 1
epochs_max: 3
early_stop_patience: 1
seed: 20261027
env_role: compatibility         # writes COMPAT.json, never FROZEN.json
